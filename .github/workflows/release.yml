name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: "Existing version tag pointing to the selected main commit (without v)"
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: release-main

jobs:
    build:
        if: github.ref == 'refs/heads/main' && inputs.version != ''
        uses: ./.github/workflows/ci.yml
        with:
            release_tag: ${{ inputs.version }}

    publish:
        name: Publish Obsidian plugin
        needs: build
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: telegram-sync
            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ inputs.version }}
                  GIT_TERMINAL_PROMPT: "0"
              run: |
                  set -o pipefail
                  tag_commit=$(git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
                    ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" \
                    | awk '$2 ~ /\^\{\}$/ { peeled=$1 } { oid=$1 } END { print peeled ? peeled : oid }')
                  test "$tag_commit" = "$GITHUB_SHA"
                  status=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                    --json isDraft,assets --jq '
                      if .isDraft then "draft"
                      elif ([.assets[].name | select(. == "main.js" or . == "manifest.json" or . == "styles.css")] | unique | length) == 3 then "published"
                      else "incomplete"
                      end' 2>/dev/null) || status=missing
                  case "$status" in
                    draft)
                      gh release upload "$RELEASE_TAG" main.js manifest.json styles.css --repo "$GITHUB_REPOSITORY" --clobber
                      gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
                      ;;
                    published) echo "Release already published with all plugin files." ;;
                    incomplete) echo "Published release is missing plugin files." >&2; exit 1 ;;
                    *)
                      gh release create "$RELEASE_TAG" main.js manifest.json styles.css \
                        --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
                      ;;
                  esac
