name: Release

on:
    push:
        tags: ["[0-9]*.[0-9]*.[0-9]*"]

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}

jobs:
    build:
        uses: ./.github/workflows/ci.yml

    publish:
        name: Publish Obsidian plugin
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: telegram-sync
            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  status=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                    --json isDraft,assets --jq '
                      if .isDraft then "draft"
                      elif ([.assets[].name | select(. == "main.js" or . == "manifest.json" or . == "styles.css")] | unique | length) == 3 then "published"
                      else "incomplete"
                      end' 2>/dev/null) || status=missing
                  case "$status" in
                    draft)
                      gh release upload "$GITHUB_REF_NAME" main.js manifest.json styles.css --repo "$GITHUB_REPOSITORY" --clobber
                      gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
                      ;;
                    published) echo "Release already published with all plugin files." ;;
                    incomplete) echo "Published release is missing plugin files." >&2; exit 1 ;;
                    *)
                      gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
                        --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
                      ;;
                  esac
